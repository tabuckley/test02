<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smooth Scrub Player</title>
  <link rel="stylesheet" href="main.css" />
  <style>
    html, body { margin:0; padding:0; background:#000; overflow:hidden; }
    video#v0 { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; }

    /* Scrub bars */
    :root { --bar-min: 520px; --bar-vw: 96vw; --bar-max: 1360px; }
    #scrubber, #scrubber2 {
      position: fixed; left: 50%; transform: translateX(-50%);
      width: clamp(var(--bar-min), var(--bar-vw), var(--bar-max));
      pointer-events:auto; z-index:10000; touch-action:none; cursor:ew-resize;
      background: transparent; box-shadow: none;
      height: 22px; /* height can be tuned or left to main.css */
    }
    #scrubber  { bottom: 48px; }   /* coarse (invisible track) */
    #scrubber2 { bottom: 16px; }   /* fine (visible red fill)   */

    .scrubber__fill {
      position:absolute; left:0; top:0; bottom:0;
      width:0%;
    }
    .scrubber__hint { display:none; }

    /* Coarse: track only, no visible fill */
    #scrubber .scrubber__fill { display:none; }

    /* Fine: show red fill */
    #scrubber2 .scrubber__fill { display:block; background:#ff2b2b; }
  </style>
</head>
<body>
  <!-- Main video -->
  <video id="v0" playsinline muted preload="auto">
    <source src="fingers.mp4" type="video/mp4" />
  </video>

  <!-- Coarse (big, mostly invisible) -->
  <div id="scrubber" role="slider" aria-label="coarse scrub" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="scrubber__fill" aria-hidden="true"></div>
    <div class="scrubber__hint" aria-hidden="true">coarse</div>
  </div>

  <!-- Fine (visible red) -->
  <div id="scrubber2" role="slider" aria-label="fine scrub" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="scrubber__fill" aria-hidden="true"></div>
    <div class="scrubber__hint" aria-hidden="true">fine</div>
  </div>

  <script>
    /************** Elements **************/
    const vid = document.getElementById('v0');
    const barCoarse = document.getElementById('scrubber');
    const barFine   = document.getElementById('scrubber2');
    const fillCoarse = barCoarse.querySelector('.scrubber__fill');
    const fillFine   = barFine.querySelector('.scrubber__fill');

    /************** Tuning **************/
    const SNAP_TO_FRAMES = false;  // keep false for smoothest feel
    const FPS = 30;                // used only if you turn snapping on

    // Throttle messages we send back to parent
    const SEND_INTERVAL_MS = 60;   // ~16–20 messages/sec
    let lastSentAt = 0;

    // Play window (optional): use whole duration by default
    let PLAY_START = 0;
    let PLAY_END   = null; // null -> full duration

    /************** Utils **************/
    const clamp01 = v => Math.max(0, Math.min(1, Number(v)||0));
    function ratioFromClientX(root, x) {
      const rect = root.getBoundingClientRect();
      const dx = Math.min(Math.max(0, x - rect.left), rect.width);
      return rect.width ? (dx / rect.width) : 0;
    }
    function inside(root, x, y) {
      const r = root.getBoundingClientRect();
      return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
    }
    function ratioToTime(r) {
      if (!isFinite(vid.duration) || vid.duration <= 0) return 0;
      const start = Math.max(0, Math.min(PLAY_START, vid.duration));
      const end   = (PLAY_END == null) ? vid.duration : Math.min(PLAY_END, vid.duration);
      const span  = Math.max(0, end - start);
      let t = start + clamp01(r) * span;
      if (SNAP_TO_FRAMES && FPS>0) t = Math.round(t * FPS) / FPS;
      return t;
    }
    function timeToRatio(t) {
      if (!isFinite(vid.duration) || vid.duration <= 0) return 0;
      const start = Math.max(0, Math.min(PLAY_START, vid.duration));
      const end   = (PLAY_END == null) ? vid.duration : Math.min(PLAY_END, vid.duration);
      const span  = Math.max(1e-6, end - start);
      return clamp01((t - start) / span);
    }

    /************** Critically-damped spring smoother **************/
    const Smooth = { target: 0, x: 0, v: 0, raf: 0, last: 0 };
    const OMEGA = 10.0;       // 8–12 recommended
    const MAX_STEP = 0.080;   // max jump per frame (sec)
    const APPLY_EPS = 0.010;  // minimum difference before applying (sec)

    function smoothSeek(t) {
      Smooth.target = t;
      if (!Smooth.raf) {
        Smooth.x = (vid.currentTime || 0);
        Smooth.v = 0;
        Smooth.last = performance.now();
        Smooth.raf = requestAnimationFrame(springLoop);
      }
    }
    function springLoop(now) {
      const dt = Math.min(0.050, Math.max(0.001, (now - Smooth.last) * 0.001));
      Smooth.last = now;

      const x = Smooth.x, v = Smooth.v, xT = Smooth.target, w = OMEGA;
      const f = w*w*(xT - x) - 2*w*v;   // critical damping
      const vNew = v + f * dt;
      let  xNew = x + vNew * dt;

      if (Math.abs(xNew - x) > MAX_STEP) {
        xNew = x + Math.sign(xNew - x) * MAX_STEP;
      }

      Smooth.x = xNew;
      Smooth.v = vNew;

      if (vid.duration && Math.abs((vid.currentTime||0) - xNew) > APPLY_EPS) {
        if (typeof vid.fastSeek === 'function') {
          try { vid.fastSeek(xNew); } catch(_) { vid.currentTime = xNew; }
        } else {
          vid.currentTime = xNew;
        }
      }

      Smooth.raf = requestAnimationFrame(springLoop);
    }

    /************** Core set-by-ratio **************/
    function setByRatio(r, { fromParent = false } = {}) {
      if (!isFinite(vid.duration) || vid.duration <= 0) return;

      const t = ratioToTime(r);
      smoothSeek(t);

      // update fills
      const p = timeToRatio(t);
      if (fillCoarse) fillCoarse.style.width = (p*100).toFixed(3) + '%';
      if (fillFine)   fillFine.style.width   = (p*100).toFixed(3) + '%';
      barCoarse.setAttribute('aria-valuenow', Math.round(p*100));
      barFine.setAttribute('aria-valuenow',   Math.round(p*100));

      // send progress back to parent (raw progress 0..1), throttled
      if (!fromParent) {
        const now = performance.now();
        if (now - lastSentAt >= SEND_INTERVAL_MS) {
          lastSentAt = now;
          try {
            parent.postMessage({ type:'scrubValue', value: p }, '*');
          } catch(_) {
            try { parent.postMessage(JSON.stringify({ type:'scrubValue', value:p }), '*'); } catch(__) {}
          }
        }
      }
    }

    /************** Pointer/hover wiring **************/
    [barCoarse, barFine].forEach(root => {
      root.addEventListener('pointerenter', e => setByRatio(ratioFromClientX(root, e.clientX)));
      root.addEventListener('mouseenter',   e => setByRatio(ratioFromClientX(root, e.clientX)));
    });

    function onMove(e) {
      const x = e.clientX, y = e.clientY;
      if (inside(barCoarse, x, y)) { setByRatio(ratioFromClientX(barCoarse, x)); return; }
      if (inside(barFine,   x, y)) { setByRatio(ratioFromClientX(barFine,   x)); return; }
    }
    addEventListener('mousemove',    onMove, { passive:true });
    addEventListener('pointermove',  onMove, { passive:true });

    [barCoarse, barFine].forEach(root => {
      let dragging = false;
      root.addEventListener('pointerdown', e => {
        dragging = true; root.setPointerCapture?.(e.pointerId);
        setByRatio(ratioFromClientX(root, e.clientX));
      });
      root.addEventListener('pointermove', e => { if (dragging) setByRatio(ratioFromClientX(root, e.clientX)); });
      const end = () => dragging = false;
      root.addEventListener('pointerup', end);
      root.addEventListener('pointercancel', end);
    });

    /************** Keep fills aligned on native updates **************/
    function syncFillsFromVideo() {
      if (!vid.duration) return;
      const p = timeToRatio(vid.currentTime || 0);
      if (fillCoarse) fillCoarse.style.width = (p*100).toFixed(3) + '%';
      if (fillFine)   fillFine.style.width   = (p*100).toFixed(3) + '%';
      barCoarse.setAttribute('aria-valuenow', Math.round(p*100));
      barFine.setAttribute('aria-valuenow',   Math.round(p*100));
    }
    ['timeupdate','seeking','seeked','play','pause','loadedmetadata'].forEach(ev => {
      vid.addEventListener(ev, syncFillsFromVideo);
    });

    /************** Parent → Child messages **************/
    addEventListener('message', (evt) => {
      const d = typeof evt.data === 'string' ? (()=>{ try{return JSON.parse(evt.data);}catch(_){return {};}})() : (evt.data||{});
      if (d.type === 'scrollValue' || d.type === 'scrubValueSmoothed') {
        const p = clamp01(d.value);
        setByRatio(p, { fromParent: true });
      }
    });

    /************** Init **************/
    vid.muted = true;
    vid.pause(); // we scrub, we don't autoplay
    vid.addEventListener('loadedmetadata', () => {
      // optional: set a custom play window
      PLAY_START = 0;
      PLAY_END   = null; // full duration
      syncFillsFromVideo();
    });
  </script>
</body>
</html>
